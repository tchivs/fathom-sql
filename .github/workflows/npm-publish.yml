name: Publish @fathom-sql/sql to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the full build+pack+publish path without pushing to the registry"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org/"

      - name: Install MoonBit (lock-driven)
        shell: bash
        run: .github/scripts/install-moonbit.sh

      - name: Build binding, copy artifacts, generate capabilities, pack
        shell: bash
        run: node npm/build.mjs

      - name: Assert package version matches the release tag
        shell: bash
        run: |
          actual="$(node -p 'require("./npm/package.json").version')"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Tag push: the tag (minus leading "v") must equal the package version.
            expected="${GITHUB_REF_NAME#v}"
            if [ "$expected" != "$actual" ]; then
              echo "version mismatch: package $actual vs tag $expected" >&2
              exit 1
            fi
            echo "package version OK (tag push): $actual"
          else
            # Manual dispatch: no tag to compare against; trust the manifest version.
            echo "package version OK (dispatch, manifest-trusted): $actual"
          fi

      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            npm pack
            tarball=$(ls *.tgz | head -1)
            echo "=== Tarball contents ==="
            tar tzf "$tarball"
            for f in binding.js binding.wasm package.json; do
              if ! tar tzf "$tarball" | grep -q "package/$f$"; then
                echo "ERROR: $f not found in tarball" >&2
                exit 1
              fi
            done
            echo "Tarball content check passed"
            npm publish --dry-run
          else
            npm publish --access public
          fi

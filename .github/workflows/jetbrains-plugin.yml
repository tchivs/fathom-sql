name: JetBrains Plugin

on:
  push:
    paths:
      - "jetbrains/**"
      - ".github/workflows/jetbrains-plugin.yml"
  pull_request:
    paths:
      - "jetbrains/**"
      - ".github/workflows/jetbrains-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: jetbrains-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify IntelliJ plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jetbrains
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: jetbrains/gradle/wrapper/gradle-wrapper.properties

      - name: Run source contract smoke
        run: python3 scripts/source-smoke.py

      - name: Verify gradle-wrapper.jar checksum
        shell: bash
        run: |
          expected="$(grep distributionSha256Sum jetbrains/gradle/wrapper/gradle-wrapper.properties | cut -d= -f2 | tr -d ' ')"
          actual="$(sha256sum jetbrains/gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "gradle-wrapper.jar checksum mismatch or missing" >&2
            exit 1
          fi
          echo "gradle-wrapper.jar checksum OK"
      - name: Run Kotlin tests, compatibility verification, and packaging
        run: ./gradlew --no-daemon clean test verifyPlugin buildPlugin

      - name: Upload plugin distribution
        uses: actions/upload-artifact@v7
        with:
          name: fathom-sql-intellij
          path: jetbrains/build/distributions/*.zip
          if-no-files-found: error

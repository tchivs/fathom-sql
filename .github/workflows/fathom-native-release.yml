name: Fathom Native Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag/release name to build (for example v0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Validate the full DAG without publishing a GitHub Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: macos-aarch64
            runner: macos-14
          - platform: windows-x86_64
            runner: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install MoonBit (lock-driven) on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          OBSERVATION_PATH: dist/moon-toolchain.json
        run: |
          mkdir -p dist
          .github/scripts/install-moonbit.sh

      - name: Install MoonBit (lock-driven) on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OBSERVATION_PATH: dist/moon-toolchain.json
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          .github/scripts/install-moonbit.ps1

      - name: Build Native LSP
        shell: bash
        run: |
          moon check --target native fathom-lsp
          moon build --target native --release fathom-lsp
          mkdir -p dist
          if [[ "${{ matrix.platform }}" == "windows-x86_64" ]]; then
            cp _build/native/release/build/fathom-lsp/fathom-lsp.exe "dist/fathom-lsp-${{ matrix.platform }}.exe"
          else
            asset="dist/fathom-lsp-${{ matrix.platform }}"
            cp _build/native/release/build/fathom-lsp/fathom-lsp.exe "$asset"
            chmod +x "$asset"
          fi

      - name: Upload Native asset
        uses: actions/upload-artifact@v7
        with:
          name: fathom-lsp-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release-gates:
    name: Release qualification gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install MoonBit (lock-driven)
        shell: bash
        run: .github/scripts/install-moonbit.sh

      - name: Build linear-Wasm facade + parity runner
        run: |
          moon build --target wasm binding
          moon build --target wasm parity

      - name: Native parity
        run: moon test --target native --package parity

      - name: JavaScript parity
        run: moon test --target js --package parity

      - name: linear-Wasm parity
        run: moon test --target wasm --package parity

      - name: compare_backends
        run: python3 scripts/compare_backends.py

      - name: diff_parity
        run: python3 scripts/diff_parity.py --frozen-only

      - name: check_naming
        run: python3 scripts/check_naming.py

      - name: verify_corpus
        run: python3 scripts/verify_corpus.py --check

      - name: corpus report
        run: python3 corpus/tools/generate_corpus_report.py --check

      - name: keywords
        run: python3 corpus/tools/check_keywords.py corpus/keywords.tsv

  release:
    name: Publish GitHub Release
    needs: [build, release-gates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download Native assets
        uses: actions/download-artifact@v8
        with:
          pattern: fathom-lsp-*
          path: dist
          merge-multiple: false

      - name: Validate toolchain evidence and write aggregate manifest
        shell: bash
        run: |
          python3 scripts/validate_toolchain_evidence.py \
            --evidence-dir dist \
            --lock .github/moonbit-toolchain.json \
            --output dist/moon-toolchain-manifest.json

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          dist = Path("dist")
          platforms = {
              "linux-x86_64": "fathom-lsp-linux-x86_64/fathom-lsp-linux-x86_64",
              "macos-aarch64": "fathom-lsp-macos-aarch64/fathom-lsp-macos-aarch64",
              "windows-x86_64": "fathom-lsp-windows-x86_64/fathom-lsp-windows-x86_64.exe",
          }
          assets = {}
          for key, name in platforms.items():
              path = dist / name
              if not path.is_file():
                  raise SystemExit(f"missing Native asset: {path}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assets[key] = {"name": name, "sha256": digest}
          manifest = {"schemaVersion": 1, "tag": tag, "assets": assets}
          (dist / "fathom-lsp-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cat dist/fathom-lsp-manifest.json

      - name: Upload aggregate manifests
        uses: actions/upload-artifact@v7
        with:
          name: fathom-release-manifests
          path: |
            dist/moon-toolchain-manifest.json
            dist/fathom-lsp-manifest.json
          if-no-files-found: error

      - name: Create or update GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/*/fathom-lsp-* \
            dist/moon-toolchain-manifest.json dist/fathom-lsp-manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

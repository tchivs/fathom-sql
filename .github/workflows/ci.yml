name: CI — MoonBit cross-target and linear-Wasm parity

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: moon check + fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install MoonBit (lock-driven)
        shell: bash
        run: .github/scripts/install-moonbit.sh

      - name: moon fmt --check
        run: moon fmt --check

      - name: moon check (native)
        run: moon check --target native

      - name: moon check (js + linear wasm, cross-platform packages only)
        # lsp/ and fathom-sql/ contain native-only C FFI (read_fd) and cannot
        # compile on js/wasm targets. Check the cross-platform core only.
        run: |
          for pkg in api source token lexer parser syntax printer formatter \
                     analyzer completion fingerprint lint binding parity dialect version; do
            moon check --target js "$pkg"
          done
          for pkg in api source token lexer parser syntax printer formatter \
                     analyzer completion fingerprint lint binding parity dialect version; do
            moon check --target wasm "$pkg"
          done

  test:
    name: moon test (native)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install MoonBit (lock-driven)
        shell: bash
        run: .github/scripts/install-moonbit.sh

      - name: moon test (native)
        # Bare `moon test` triggers MoonBit error 4219 (foreign_library binding
        # #export_name in a test-target build) on the pinned toolchain — a known
        # boundary since v1 (04-03). Run the per-package suites that cover the
        # full behavioral surface instead.
        run: |
          moon test --target native \
            --package test --package parity-tests --package lsp --package api \
            --package source --package token --package lexer --package parser \
            --package printer --package syntax --package completion --package analyzer \
            --package fingerprint --package lint --package fathom-sql

  linear-wasm-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install MoonBit (lock-driven)
        shell: bash
        run: .github/scripts/install-moonbit.sh

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # The linear-Wasm runtime execution step (CLOSE-02): build the foreign
      # library facade and the parity runner for the linear Wasm backend, then
      # RUN the parity corpus ON the wasm target. `moon test --target wasm`
      # executes the same serialized-byte assertions the native target runs,
      # catching runtime-only failures (memory, ABI, SIMD) that `moon build`
      # alone cannot. The parity module has zero imports, so it stays portable.
      - name: Build linear-Wasm facade + parity runner
        run: |
          moon build --target wasm binding
          moon build --target wasm parity-tests

      - name: Execute parity suite on linear-Wasm target
        run: moon test --target wasm --package parity-tests

      # Byte-parity cross-check: run the identical suite on native so a wasm-only
      # regression cannot silently diverge from the reference target.
      - name: Execute parity suite on native target
        run: moon test --target native --package parity-tests

      # Three-target matrix completion (D-05 / PARITY-02): the JS backend had
      # only `moon check` in CI (Research §4.5 gap). Running the parity suite on
      # js closes the gap so a js-only byte regression cannot silently diverge —
      # the MoonBit snapshot mechanism compares this target against the SAME
      # committed parity-tests/__snapshot__ files as wasm and native (byte identity of
      # serialized results, diagnostics, spans, and lossless replay).
      - name: Execute parity suite on JavaScript target
        run: moon test --target js --package parity-tests

      # Cross-backend aggregate report: proves the three-target byte parity via a
      # deterministic sha256 tree digest over the committed snapshot tree (wasm
      # cannot stdout-dump, A8), names any failing fixture, and fails closed on a
      # skipped/failed target, an empty tree, or a digest divergence (Pitfall 8).
      # Read-only: never writes parity-tests/__snapshot__ (no --update anywhere in CI).
      - name: Cross-backend byte-parity aggregate (compare_backends)
        run: python3 scripts/compare_backends.py

  parity-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install MoonBit (lock-driven)
        shell: bash
        run: .github/scripts/install-moonbit.sh

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # D-08 byte-level gate: moon test --package parity WITHOUT --update fails
      # on ANY snapshot difference (T-09-01). NEVER add --update to this job —
      # the only sanctioned snapshot writer is a moon test --update run whose
      # change is already pre-declared in approved-changes.md (single-use
      # approval path, research §9.3).
      - name: Baseline snapshot gate (byte-level)
        run: moon test --package parity-tests

      # Self-diff must report zero unexpected: the committed snapshot tree is
      # the frozen baseline, so left == right is the steady state (D-08).
      - name: Baseline diff self-check (approved vs unexpected)
        run: python3 scripts/baseline_diff.py --left parity-tests/__snapshot__ --right parity-tests/__snapshot__ --approve .planning/milestones/v2.0-phases/09-dialect-boundary-and-neutral-naming/approved-changes.md

      # T-09-03 provenance pin (MI-04): baseline-hashes.txt fixes the corpus
      # files' SHA-256. Any corpus drift — even one that keeps manifest and
      # keyword surfaces intact and so escapes the corpus job — fails CI here
      # instead of silently expiring the pinned hashes.
      - name: Baseline corpus hash pin (sha256sum -c)
        run: sha256sum -c parity/baseline-hashes.txt

      # D-03 frozen-vs-current proof (PARITY-01): regenerates the snapshot tree
      # in a temp `moon test --update` lifecycle (working tree untouched and
      # restored) and FAILS on ANY byte/path difference vs the committed tree —
      # strictly stronger than the vacuous left==right self-check above. The
      # approved-changes register is NOT consulted, so an empty/forged register
      # cannot mask drift. NEVER --update in CI (Pitfall 1) — this step only
      # REGENERATES into a temp dir and never writes the committed tree.
      - name: Frozen-vs-current regeneration proof (diff_parity)
        run: python3 scripts/diff_parity.py --frozen-only

  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # D-06 offline Flink corpus gate (PARITY-03): stdlib read-only verifier over
      # the committed manifest/.sql/snapshot artifacts — header shape, Calcite/
      # parser-config pins vs dialect/flink.mbt, 6-category enum, expected-status
      # consistency, fixture_sha256 over committed .sql bytes, and strict+editor
      # snapshot completeness. No network / Doris FE / Flink cluster / DB access;
      # a missing research archive degrades to archive-not-present (never fail,
      # never fabricated). The extended generate_corpus_report.py --check below
      # enforces the parser-acceptance vs engine-prerequisite distinction.
      - name: Offline Flink corpus verifier
        run: python3 scripts/verify_corpus.py --check

      - name: Corpus report --check
        run: python3 corpus/tools/generate_corpus_report.py --check

      - name: Keyword classification check
        run: python3 corpus/tools/check_keywords.py corpus/keywords.tsv

  naming-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # NAME-04: reject product-level remnants of the legacy product identity
      # (CLI/module names, LSP binary names, binding exports, wire schema
      # namespaces, diagnostic code prefixes, host config keys/plugin ids,
      # display titles) in current source, config, CI, extensions, and docs.
      # The allowlist is limited to Doris dialect semantics and provenance
      # (D-05); historical archives are exempt (D-04). NEVER add an update-like
      # bypass to this job.
      - name: Neutral naming inventory
        run: python3 scripts/check_naming.py

  host-packaging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # The ONLY network-bearing bootstrap in this job is the MoonBit installer
      # curl (mirrors check/test/parity). The three host smokes themselves are
      # fully offline — no Doris FE, Flink cluster, database, or runtime registry
      # pull (PARITY-03, D-08). npm ci / gradle dependency resolution restore
      # from the pinned action caches when warm; a cold-cache fetch is a
      # build-time dependency restore (setup-node/setup-java), never a smoke
      # runtime call. NO --update anywhere (Pitfall 1): this is a smoke job,
      # never a snapshot writer.
      - name: Install MoonBit (lock-driven)
        shell: bash
        run: .github/scripts/install-moonbit.sh

      - name: Build native fathom-lsp + JS binding
        run: |
          moon build --target native fathom-lsp
          moon build --target js binding

      - name: Locate built fathom-lsp
        id: lsp
        shell: bash
        run: |
          for candidate in \
            "${{ github.workspace }}/_build/native/debug/build/fathom-lsp/fathom-lsp.exe" \
            "${{ github.workspace }}/target/native/debug/build/fathom-lsp/fathom-lsp.exe"; do
            if [ -f "$candidate" ]; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::fathom-lsp binary not found after moon build" >&2
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            vscode/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: jetbrains/gradle/wrapper/gradle-wrapper.properties

      # Each host step is fail-closed (no continue-on-error): a skipped or
      # silently-passed host must red the job (Pitfall 8, ECO-07 precedent).
      - name: Web Chromium smoke (offline)
        shell: bash
        run: |
          cd web
          npm ci
          npm run build
          node scripts/offline-smoke.mjs --offline

      - name: VS Code real extension-host smoke (Xvfb)
        shell: bash
        env:
          FATHOM_LSP_PATH: ${{ steps.lsp.outputs.path }}
        run: |
          cd vscode
          npm ci
          npm run build
          xvfb-run -a node scripts/host-verify.mjs

      - name: Verify gradle-wrapper.jar checksum
        shell: bash
        run: |
          expected="$(grep distributionSha256Sum jetbrains/gradle/wrapper/gradle-wrapper.properties | cut -d= -f2 | tr -d ' ')"
          actual="$(sha256sum jetbrains/gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "gradle-wrapper.jar checksum mismatch or missing" >&2
            exit 1
          fi
          echo "gradle-wrapper.jar checksum OK"
      - name: IntelliJ Gradle build + LSP launch smoke
        shell: bash
        run: |
          cd jetbrains
          python3 scripts/source-smoke.py
          ./gradlew --no-daemon test verifyPlugin buildPlugin

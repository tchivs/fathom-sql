<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Offline Doris SQL diagnostics and formatting demo">
  <link rel="icon" href="data:,">
  <title>Doris SQL — offline parser demo</title>
  <link rel="stylesheet" href="./src/styles.css">
  <script type="importmap">
    {
      "imports": {
        "monaco-editor": "./node_modules/monaco-editor/esm/vs/editor/editor.api.js"
      }
    }
  </script>
</head>
<body>
  <main class="shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">Offline parser workspace</p>
        <h1>Doris SQL diagnostics</h1>
      </div>
      <p id="profile-metadata" class="metadata">Doris profile 4.x</p>
    </header>
    <section class="toolbar" aria-label="Parser controls">
      <div class="control-group">
        <label for="profile">Doris profile</label>
        <select id="profile" name="profile" required></select>
      </div>
      <button id="format" class="primary-action" type="button" disabled>Format document</button>
      <p id="result-message" class="result-message" aria-live="polite"></p>
    </section>
    <p id="parser-status" class="status" role="status" aria-live="polite">Loading parser artifact…</p>
    <section class="workspace" aria-label="Doris SQL editor workspace">
      <article class="editor-pane">
        <h2>SQL source</h2>
        <div id="editor" class="editor" aria-label="Doris SQL source editor"></div>
      </article>
      <aside id="diagnostics" class="diagnostics-pane" aria-labelledby="diagnostics-heading">
        <h2 id="diagnostics-heading">No diagnostics</h2>
        <p>Type or paste Doris SQL to see diagnostics here.</p>
      </aside>
    </section>
    <section id="artifact-error" class="artifact-error" role="alert" hidden>
      <p class="artifact-message"></p>
      <button id="reload" type="button">Reload demo</button>
    </section>
    <footer class="footer-note">All parsing and formatting stays in the local generated artifact. No network, database, service, or authentication is used.</footer>
  </main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
